<script>
  /* あたらしい版が でたら 自動で よみこみなおす(ホーム画面アプリは 古いファイルが のこりやすい ため) */
  window.MANATAMA_V = "202611191045";
  (function () {
    function check() {
      try {
        fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
          if (!j || !j.v || j.v === window.MANATAMA_V) return;
          if (sessionStorage.getItem("mt-reload") === j.v) return; // おなじ版で なんども よみこまない
          sessionStorage.setItem("mt-reload", j.v);
          location.replace(location.pathname + "?v=" + j.v);
        }).catch(function () {});
      } catch (e) {}
    }
    check();
    document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
  })();
  </script>
